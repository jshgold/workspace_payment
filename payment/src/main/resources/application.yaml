spring:
  application:
    name: payment
  profiles:
    active: ${PROFILE_SETTING:local}
    group:
      toss: local,toss
  data:
    web:
      pageable:
        max-page-size: 100
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
