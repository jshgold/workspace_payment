spring:
  datasource:
    url: jdbc:mysql://localhost:3306/payment?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: payment
    password: payment
  jpa:
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    # 실행되는 SQL
    org.hibernate.SQL: debug
    # 바인딩 파라미터 값 (Hibernate 6+ 에서는 org.hibernate.orm.jdbc.bind)
    org.hibernate.orm.jdbc.bind: trace
