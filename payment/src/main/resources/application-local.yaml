spring:
  datasource:
    url: jdbc:mysql://localhost:3306/payment_p?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: payment
    password: payment
  jpa:
    properties:
      hibernate:
        format_sql: true

app:
  redis:
    # Redisson 분산 락용. RedisLockExecutor가 첫 사용 시점에 연결한다. (Redis를 안 쓰는 기능은 영향 없음)
    address: redis://localhost:6379

logging:
  level:
    # 실행되는 SQL
    org.hibernate.SQL: debug
    # 바인딩 파라미터 값 (Hibernate 6+ 에서는 org.hibernate.orm.jdbc.bind)
    org.hibernate.orm.jdbc.bind: trace
